# Runs every platform test, through the suite each one belongs to.
#
# A test is registered in exactly one suite: data_processing_test_suite or
# export_test_suite. The two carry no depends_on, so they run in parallel, as
# every test inside them does.

resources:
  jobs:
    integration_test_suite:
      name: integration_test_suite
      tasks:
        - task_key: data_processing_test_suite
          run_job_task:
            job_id: ${resources.jobs.data_processing_test_suite.id}

        - task_key: export_test_suite
          run_job_task:
            job_id: ${resources.jobs.export_test_suite.id}
