bundle:
  name: dbx_flame
  engine: direct

include:
  - workflows/platform_tests/*.yml
  - workflows/*.yml

variables:
  platform_tests_catalog:
    description: Catalog prefix for the platform tests; the framework appends _<target>.
    default: dbx_flame

artifacts:
  dbx_flame_wheel:
    type: whl
    # --clean empties dist/ first.
    build: poetry build --clean
    path: .

targets:
  dev:
    presets:
      tags:
        project: dbx-flame
        environment: ${bundle.target}
    mode: development
    variables:
      platform_tests_catalog: dbx_flame
    workspace:
      profile: dbx_flame_profile

  dev_01:
    default: true
    mode: development
    variables:
      platform_tests_catalog: testing
    workspace:
      profile: dbx_flame_profile
