[project]
name = "dbx-flame"
version = "0.0.0"
description = "Configuration-driven Databricks data engineering framework (medallion architecture)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.0,<4.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "databricks-labs-dqx (>=0.16.0,<0.17.0)",
]

[project.scripts]
dbx-flame = "dbx_flame.entrypoints.run:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "dbx_flame", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
chispa = ">=0.9"
black = ">=23.0"
flake8 = ">=6.0"
mypy = ">=1.0"
ruff = ">=0.1"
yamllint = "^1.38.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dbx_flame --cov-fail-under=70 --cov-report=term-missing"

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["I"]
